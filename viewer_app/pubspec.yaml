name: viewer_app
description: Uziy — targeted rewarded-video platform for Mongolia (viewer app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Bundled Material / Cupertino / Widgets translations for showDatePicker,
  # showTimePicker, back-button tooltips, etc. Required to render the
  # calendar in Mongolian.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0

  # Secure storage for the auth token
  flutter_secure_storage: ^9.2.2

  # Formatting
  # Bumped from 0.19 to satisfy flutter_localizations' peer dep.
  intl: ^0.20.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  lucide_icons_flutter: ^3.1.22
  # Opens the SMS app pre-filled for phone verification (verify.mn).
  url_launcher: ^6.3.3
  video_player: ^2.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_mark.png
    # Bank logos for the payout form (file names: wallet_logic.dart kBankLogoAssets).
    - assets/banks/

# Run once to (re)generate iOS + Android + web launcher icons from the source:
#   flutter pub get
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ adaptive icon (and Android 13 themed icon): the mark alone on a transparent 1024 canvas, sized to
  # sit inside the 66/108 safe zone, over a white layer — the same look as the legacy icon.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_foreground.png"
  # The foreground file already keeps the mark inside the safe zone, so no extra inset.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B0B0F"
    theme_color: "#FFCE00"
  min_sdk_android: 24

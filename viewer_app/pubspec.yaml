name: viewer_app
description: Uziy — targeted rewarded-video platform for Mongolia (viewer app).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Bundled Material / Cupertino / Widgets translations for showDatePicker,
  # showTimePicker, back-button tooltips, etc. Required to render the
  # calendar in Mongolian.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation
  go_router: ^14.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0

  # Video playback (HLS from Cloudflare R2)
  video_player: ^2.9.1
  chewie: ^1.8.1

  # Local storage for auth token
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Formatting
  # Bumped from 0.19 to satisfy flutter_localizations' peer dep.
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Run once to (re)generate iOS + Android + web launcher icons from the source:
#   flutter pub get
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B0B0F"
    theme_color: "#FFCE00"
  min_sdk_android: 21

services:
  postgres:
    image: postgres:16-alpine
    container_name: uziy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uziy
      POSTGRES_PASSWORD: uziy_dev
      POSTGRES_DB: uziy
    volumes:
      - uziy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uziy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev-only DB browser → http://localhost:5050 (no login; server is pre-
  # registered, password when asked: uziy_dev). Never expose this in prod.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uziy-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uziy.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - uziy_pgadmin:/var/lib/pgadmin

volumes:
  uziy_pgdata:
  uziy_pgadmin:

services:
  postgres:
    image: postgres:16-alpine
    container_name: zoos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: zoos
      POSTGRES_PASSWORD: zoos_dev
      POSTGRES_DB: zoos
    volumes:
      - zoos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zoos_pgdata:

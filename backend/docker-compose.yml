# Database (+ pgAdmin) for local development. The root docker-compose.yml includes
# this file and adds the backend and both panels; `cd backend && docker compose up -d
# postgres` still starts just the database. Both files are the same project ("uziy").
name: uziy

services:
  postgres:
    image: postgres:16-alpine
    container_name: uziy-postgres
    restart: unless-stopped
    # Only this Mac can connect (audit 2026-10-22): published on 0.0.0.0, anyone on the same Wi-Fi could read
    # every phone number and bank account with the dev password.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: uziy
      POSTGRES_PASSWORD: uziy_dev
      POSTGRES_DB: uziy
    volumes:
      - uziy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uziy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev-only DB browser → http://localhost:5050 (no login; server is pre-
  # registered, password when asked: uziy_dev). Bound to 127.0.0.1 because it has
  # no login of its own. Never run it in prod.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: uziy-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@uziy.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - uziy_pgadmin:/var/lib/pgadmin

# Pinned names: the data created before 2026-10-21 (when this was project "backend")
# lives in these volumes, so it survives whichever compose file starts the database.
volumes:
  uziy_pgdata:
    name: backend_uziy_pgdata
  uziy_pgadmin:
    name: backend_uziy_pgadmin

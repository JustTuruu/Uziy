# Production profile: activate with SPRING_PROFILES_ACTIVE=prod.
# Every secret comes from the environment with NO default, so a missing one stops the app at startup
# instead of silently falling back to a development value. ProductionReadinessCheck then verifies the rest.
uziy:
  jwt:
    secret: ${JWT_SECRET}
  payments:
    simulated: false
  phone-verification:
    provider: ${PHONE_VERIFICATION_PROVIDER}
    verify-mn:
      api-key: ${VERIFY_MN_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  # Behind a reverse proxy / load balancer: trust X-Forwarded-* from it (client IP, https).
  forward-headers-strategy: framework
  error:
    include-message: always
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoint:
    health:
      show-details: never

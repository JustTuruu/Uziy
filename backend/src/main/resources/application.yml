spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: uziy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uziy}
    username: ${DB_USER:uziy}
    password: ${DB_PASSWORD:uziy_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always
    # Explicit: spring-boot-devtools (dev machines) would otherwise turn traces ALWAYS on.
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

uziy:
  jwt:
    # 256-bit dev-only secret. Rotate + inject via env in prod.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-do-not-ship-this-keyminimum-256-bit}
    ttl-hours: 24
  payments:
    # true → the company's "Төлөх" button marks a campaign paid instantly
    # (no money moves). Set PAYMENTS_SIMULATED=false in prod until the real
    # QPay gateway is wired; the pay endpoint then answers 503.
    # The platform commission itself is NOT configured here — the Super Admin
    # sets it in platform_settings (PATCH /admin/platform-settings).
    simulated: ${PAYMENTS_SIMULATED:true}
  push:
    # false -> pushes are only logged (no Firebase needed). true -> Firebase Cloud
    # Messaging (Android + iOS); FCM_CREDENTIALS_PATH must point at the Firebase
    # service-account JSON, otherwise startup fails.
    enabled: ${PUSH_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
  phone-verification:
    # Registration and password reset prove the phone: the user texts a 6-digit code FROM it to verify.mn's 144773.
    # simulated -> nothing is texted; a check is verified only when a developer runs the curl the log prints (development).
    # verifymn  -> verify.mn; VERIFY_MN_API_KEY (Developer Console) is required, startup fails without it.
    provider: ${PHONE_VERIFICATION_PROVIDER:simulated}
    verify-mn:
      base-url: ${VERIFY_MN_BASE_URL:https://api.verify.mn}
      api-key: ${VERIFY_MN_API_KEY:}
  console-login:
    # false -> admins and companies sign in with the password alone (owner, 2026-10-26).
    # true  -> on an unknown browser they also text a code from the account's phone (see phone-verification).
    phone-check: ${CONSOLE_LOGIN_PHONE_CHECK:false}
  cors:
    allowed-origins:
      - http://localhost:3000 # company_panel
      - http://localhost:3001 # admin_panel (super admin)
      - http://localhost:8080

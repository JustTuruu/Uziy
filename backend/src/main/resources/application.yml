spring:
  application:
    name: uziy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uziy}
    username: ${DB_USER:uziy}
    password: ${DB_PASSWORD:uziy_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

uziy:
  jwt:
    # 256-bit dev-only secret. Rotate + inject via env in prod.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-do-not-ship-this-keyminimum-256-bit}
    ttl-hours: 24
  payments:
    # true → the company's "Төлөх" button marks a campaign paid instantly
    # (no money moves). Set PAYMENTS_SIMULATED=false in prod until the real
    # QPay gateway is wired; the pay endpoint then answers 503.
    # The platform commission itself is NOT configured here — the Super Admin
    # sets it in platform_settings (PATCH /admin/platform-settings).
    simulated: ${PAYMENTS_SIMULATED:true}
  push:
    # false -> pushes are only logged (no Firebase needed). true -> Firebase Cloud
    # Messaging (Android + iOS); FCM_CREDENTIALS_PATH must point at the Firebase
    # service-account JSON, otherwise startup fails.
    enabled: ${PUSH_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
  otp:
    # logging -> one-time codes are only written to the log (development).
    # A real SMS channel = a new OtpSender @Component selected by this value; with
    # "logging" left on in production nobody receives a code and nobody can register.
    sender: ${OTP_SENDER:logging}
  cors:
    allowed-origins:
      - http://localhost:3000 # company_panel
      - http://localhost:3001 # admin_panel (super admin)
      - http://localhost:8080

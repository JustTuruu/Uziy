# The console is a single-page app: every path that is not a file gets index.html and the router takes over.
# nginx drops the server's add_header lines in any location that sets its own, so each location includes the
# security headers (written by `vite build` from @uziy/ui/security-headers).
server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Hashed file names: safe to keep for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Always ask again, so a new release is picked up at once.
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest
    # Secrets are not exposed to the `if:` expression directly, so mirror them
    # into env. The scan only runs once SonarQube is configured:
    #   Secrets:   SONAR_TOKEN, SONAR_HOST_URL
    #   Variables: SONAR_PROJECT_KEY   (Settings > Secrets and variables > Actions)
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Check SonarQube configuration
        id: config
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_PROJECT_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "SonarQube is not configured (SONAR_TOKEN / SONAR_HOST_URL / SONAR_PROJECT_KEY missing) - skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # full history for accurate blame / new-code detection

      - name: Analyze with SonarQube
        if: steps.config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@7295e71c9583053f5bf40e9d4068a0c974603ec8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=backend/src/main,admin_panel/app,admin_panel/components,admin_panel/lib,company_panel/app,company_panel/components,company_panel/lib,packages/ui/src,viewer_app/lib
            -Dsonar.tests=backend/src/test,viewer_app/test
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/*.test.ts,**/*.test.tsx

name: Flutter (viewer_app)

on:
  push:
    branches: [ "main" ]
    paths: [ "viewer_app/**", ".github/workflows/dart.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "viewer_app/**", ".github/workflows/dart.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Flutter app lives in a sub-directory, not at the repo root.
        working-directory: viewer_app

    steps:
      - uses: actions/checkout@v4

      # viewer_app is a Flutter project: it needs the Flutter SDK (which bundles
      # Dart), `flutter test` instead of `dart test`, etc.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

# Whole local stack in one command, from the repo root:
#
#   docker compose up -d --build     # build + start (first build takes a few minutes)
#   docker compose logs -f backend   # backend log (prints the dev SMS curl)
#   docker compose down              # stop (data is kept)
#
#   console        http://localhost:3000   (companies at /, admins at /admin; one sign-in page)
#   backend API    http://localhost:8080
#   pgAdmin        http://localhost:5050
#
# Local secrets (VERIFY_MN_API_KEY, PHONE_VERIFICATION_PROVIDER, ...) are read from
# backend/.env when it exists; see backend/.env.example. This stack is for local
# development only — it uses the dev database password. Put a random JWT_SECRET in
# backend/.env (`openssl rand -base64 64`): the backend port is reachable from the LAN
# (the phone needs it), and the committed dev secret would let anyone there forge an
# admin token. The database and pgAdmin are bound to 127.0.0.1.
name: uziy

include:
  - backend/docker-compose.yml # postgres + pgadmin

services:
  backend:
    build: ./backend
    container_name: uziy-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Inside the compose network the database is the "postgres" service. These
      # win over anything in backend/.env.
      DB_URL: jdbc:postgresql://postgres:5432/uziy
      DB_USER: uziy
      DB_PASSWORD: uziy_dev
    # Open to the LAN on purpose: the app on a real phone talks to http://<Mac IP>:8080.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  console:
    restart: unless-stopped
    depends_on:
      backend:
        # A console that answers can sign in straight away.
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/console.Dockerfile
      args:
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    container_name: uziy-console
    ports:
      - "3000:3000"
